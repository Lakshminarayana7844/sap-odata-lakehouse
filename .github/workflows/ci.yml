name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit and e2e tests
        run: python -m pytest -q
      - name: Docker demo
        run: docker build -t sap-odata-lakehouse . && docker run --rm sap-odata-lakehouse
